<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD de Setups ACC</title>
    <style>
        body {
            font-family: 'Segoe UI', Montserrat, Arial, sans-serif;
            background-color: #0b0b0b;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px;
            user-select: none;
            box-sizing: border-box;
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 2rem;
            margin-bottom: 25px;
            color: #f0f0f0;
            border-bottom: 3px solid #ff4500;
            padding-bottom: 10px;
            text-align: center;
        }

        /* Controle das Telas */
        .screen {
            width: 100%;
            max-width: 1400px;
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .screen.active {
            display: block;
            opacity: 1;
        }

        .main-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            padding: 20px;
            background-color: #141414;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }

        /* Botões Padrão */
        .hud-button {
            background-color: #1f1f1f;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 0;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            outline: none;
        }

        .hud-button:hover {
            transform: translateY(-5px);
            border-color: #ff4500;
            box-shadow: 0 8px 20px rgba(255, 69, 0, 0.4);
        }

        .hud-button.clicked {
            animation: pulse-click 0.3s forwards ease-in-out;
        }

        @keyframes pulse-click {
            0% { transform: scale(1); }
            50% { transform: scale(0.93); border-color: #ff4500; box-shadow: 0 0 25px rgba(255, 69, 0, 0.9); }
            100% { transform: scale(1); }
        }

        /* Estilo dos Carros */
        .car-card .img-container {
            width: 100%;
            height: 110px;
            background-color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .car-card .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .car-card:hover .img-container img {
            transform: scale(1.05);
        }

        .car-card .text-container {
            padding: 10px;
            text-align: center;
            background-color: #1a1a1a;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .car-card h2 {
            font-size: 0.95rem;
            margin: 0 0 3px 0;
            color: #ffffff;
            text-transform: uppercase;
        }

        .car-card p {
            font-size: 0.75rem;
            color: #aaa;
            margin: 0;
        }

        /* ESTILO DOS CARDS DE PISTAS (IMAGENS PNG) */
        .track-card {
            background-color: #161616;
            background-image: radial-gradient(circle, #222222 0%, #0d0d0d 100%);
            border: 2px solid #282828;
            border-radius: 12px;
            aspect-ratio: 1 / 1.15;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }

        .track-card:hover {
            border-color: #ff4500;
            box-shadow: 0 8px 25px rgba(255, 69, 0, 0.3);
        }

        .track-card .map-container {
            width: 100%;
            height: 75%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .track-card img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            filter: drop-shadow(0px 0px 4px rgba(255, 255, 255, 0.2));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .track-card:hover img {
            transform: scale(1.08);
            filter: drop-shadow(0px 0px 10px rgba(255, 69, 0, 0.7));
        }

        .track-card .track-title {
            width: 100%;
            text-align: center;
            font-size: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 5px;
        }

        /* Botão de Voltar e Infos */
        .back-btn {
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s, border-color 0.2s;
        }

        .back-btn:hover {
            background-color: #ff4500;
            border-color: #ff4500;
        }

        .selected-info {
            color: #ff4500;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-align: center;
        }
        /* ESTILO DA TELA DE CLIMA (SPLIT DIAGONAL) */
        .weather-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .split-card {
            position: relative;
            width: 100%;
            max-width: 750px;
            height: 450px;
            background-color: #111;
            border-radius: 20px;
            border: 3px solid #333;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .split-half {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .split-half img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.65);
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        .split-half .label {
            position: relative;
            z-index: 2;
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(0,0,0,0.9);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        /* LADO SOL */
        .split-sun {
            clip-path: polygon(0 0, 100% 0, 0 100%);
        }

        .split-sun .label {
            margin-right: 35%;
            margin-bottom: 20%;
        }

        .split-sun:hover img {
            filter: brightness(1);
            transform: scale(1.05);
        }

        .split-sun:hover .label {
            color: #ffaa00;
            transform: scale(1.1);
        }

        /* LADO CHUVA */
        .split-rain {
            clip-path: polygon(100% 0, 100% 100%, 0 100%);
        }

        .split-rain .label {
            margin-left: 35%;
            margin-top: 20%;
        }

        .split-rain:hover img {
            filter: brightness(1);
            transform: scale(1.05);
        }

        .split-rain:hover .label {
            color: #00aaff;
            transform: scale(1.1);
        }

    </style>
</head>

    <!-- ⬇️ O SCRIPT VEM LOGO EM SEGUIDA ⬇️ -->
       <script>
        let selectedCarName = "";
        let selectedCarFolder = "";
        let selectedTrackName = "";
        let selectedTrackFolder = "";
        let selectedWeatherName = "";
        let selectedWeatherFolder = "";

        /* Seleção de Carro */
        function selectCar(element, carName, carFolder) {
            element.classList.add('clicked');
            selectedCarName = carName;
            selectedCarFolder = carFolder;

            setTimeout(() => {
                element.classList.remove('clicked');
                document.getElementById('selected-car-display').innerText = "Carro Selecionado: " + selectedCarName;
                document.getElementById('cars-screen').classList.remove('active');
                document.getElementById('tracks-screen').classList.add('active');
                window.scrollTo(0, 0);
            }, 300);
        }

        /* Seleção de Pista */
        function selectTrack(element, trackName, trackFolder) {
            element.classList.add('clicked');
            selectedTrackName = trackName;
            selectedTrackFolder = trackFolder;

            setTimeout(() => {
                element.classList.remove('clicked');
                document.getElementById('selected-summary-display').innerText = selectedCarName + "  |  " + selectedTrackName;
                document.getElementById('tracks-screen').classList.remove('active');
                document.getElementById('weather-screen').classList.add('active');
                window.scrollTo(0, 0);
            }, 300);
        }

        /* Seleção de Clima */
        function selectWeather(element, weatherName, weatherFolder) {
            element.classList.add('clicked');
            selectedWeatherName = weatherName;
            selectedWeatherFolder = weatherFolder;

            setTimeout(() => {
                element.classList.remove('clicked');

                console.log("=== SELEÇÃO FINAL CONCLUÍDA ===");
                console.log("Carro:", selectedCarName, "(Pasta: " + selectedCarFolder + ")");
                console.log("Pista:", selectedTrackName, "(Pasta: " + selectedTrackFolder + ")");
                console.log("Clima:", selectedWeatherName, "(Pasta: " + selectedWeatherFolder + ")");

                onSelectionComplete();
            }, 300);
        }

        /* Navegação do Botão Voltar */
        function goBackToCars() {
            document.getElementById('tracks-screen').classList.remove('active');
            document.getElementById('weather-screen').classList.remove('active');
            document.getElementById('cars-screen').classList.add('active');
            window.scrollTo(0, 0);
        }

        function goBackToTracks() {
            document.getElementById('weather-screen').classList.remove('active');
            document.getElementById('cars-screen').classList.remove('active');
            document.getElementById('tracks-screen').classList.add('active');
            window.scrollTo(0, 0);
        }

        /* Função chamada após selecionar o clima */
        function onSelectionComplete() {
            // Próximo passo: Ação de carregar o Setup final
        }
    </script>
